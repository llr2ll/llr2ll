<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Raphael Sanseverino — Full-stack developer">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#ff6b35"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e91e8c"/><stop offset=".5" stop-color="#ff6b35"/><stop offset="1" stop-color="#00d4ff"/></linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#001e8b"/></linearGradient>
  <radialGradient id="glowP" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e91e8c" stop-opacity=".26"/><stop offset="1" stop-color="#e91e8c" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00d4ff" stop-opacity=".14"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
  <clipPath id="av"><circle cx="830" cy="170" r="88"/></clipPath>
  <clipPath id="card"><rect width="1000" height="340" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="340" fill="#0a0a0a"/>
  <circle cx="800" cy="150" r="300" fill="url(#glowP)"/>
  <circle cx="80" cy="330" r="240" fill="url(#glowC)"/>
  <rect x=".5" y=".5" width="999" height="339" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- availability pill -->
  <rect x="48" y="44" width="318" height="30" rx="15" fill="#e91e8c" fill-opacity=".15" stroke="#e91e8c" stroke-opacity=".35"/>
  <circle cx="68" cy="59" r="4.5" fill="#39d353"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="82" y="63.5" fill="#ffffff" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">AVAILABLE FOR NEW OPPORTUNITIES</text>

  <text x="48" y="116" fill="#a0a0a0" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600">Hi, I'm</text>
  <text x="48" y="172" fill="#ffffff" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1">Raphael Sanseverino</text>
  <text x="48" y="212" fill="#e8e8e8" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700">Full-stack developer who ships</text>
  <text x="48" y="242" fill="url(#g)" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="800">clean, fast, useful products</text>

  <!-- stack chips -->
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="48"  y="266" width="74"  height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="85"  y="284.5" fill="#00d4ff">React</text>
    <rect x="130" y="266" width="104" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="182" y="284.5" fill="#00d4ff">TypeScript</text>
    <rect x="242" y="266" width="86"  height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="285" y="284.5" fill="#e91e8c">Node.js</text>
    <rect x="336" y="266" width="84"  height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="378" y="284.5" fill="#e91e8c">Angular</text>
    <rect x="428" y="266" width="104" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="480" y="284.5" fill="#ff6b35">Supabase</text>
  </g>

  <!-- avatar with rotating gradient ring -->
  <g>
    <circle cx="830" cy="170" r="104" fill="none" stroke="url(#ring)" stroke-width="5" stroke-dasharray="560 100" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 830 170" to="360 830 170" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="170" r="94" fill="#0a0a0a"/>
    <image href="data:image/jpeg;base64," x="742" y="82" width="176" height="176" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- code card -->
  <g transform="translate(655 238)">
    <rect width="190" height="74" rx="10" fill="#111111" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="14" cy="13" r="3.5" fill="#ff4444"/><circle cx="26" cy="13" r="3.5" fill="#ffd700"/><circle cx="38" cy="13" r="3.5" fill="#39d353"/>
    <g font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="11">
      <text x="14" y="36"><tspan fill="#e91e8c">const</tspan><tspan fill="#cfcfcf"> dev = {</tspan></text>
      <text x="24" y="50" fill="#cfcfcf">stack: <tspan fill="#39d353">"React · Node · TS"</tspan>,</text>
      <text x="24" y="64" fill="#cfcfcf">open: <tspan fill="#ffd700" font-weight="700">true</tspan> }</text>
    </g>
  </g>
</g>
</svg>